
services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskforge
      POSTGRES_USER: taskforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5433:5432"
    volumes:
      - taskforge_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskforge -d taskforge"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.4.0
    container_name: taskforge-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka_data:/var/lib/kafka/data

  user-service:
    build:
      context: ./taskForge-ai-users
      target: runtime
    restart: unless-stopped
    environment:
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: taskforge_users
      DB_USER: taskforge
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      AUTH_SERVICE_URL: http://auth-service:3001
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  auth-service:
    build:
      context: ./taskforge-auth-service
      target: runtime
    restart: unless-stopped
    environment:
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: taskforge_auth
      DB_USER: taskforge
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      USER_SERVICE_URL: http://user-service:3000
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt-private-key
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_ISSUER: taskforge-auth-service
      JWT_AUDIENCE: taskforge-api
    ports:
      - "3001:3001"
    secrets:
      - jwt-private-key
    depends_on:
      postgres:
        condition: service_healthy
      user-service:
        condition: service_started

  user-migrate:
    build:
      context: ./taskForge-ai-users
      target: migration
    restart: "no"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: taskforge_users
      DB_USER: taskforge
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    profiles:
      - migrations
    depends_on:
      postgres:
        condition: service_healthy

  auth-migrate:
    build:
      context: ./taskforge-auth-service
      target: migration
    restart: "no"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: taskforge_auth
      DB_USER: taskforge
      DB_PASSWORD: ${POSTGRES_PASSWORD}
    profiles:
      - migrations
    depends_on:
      postgres:
        condition: service_healthy
      user-migrate:
        condition: service_completed_successfully

secrets:
  jwt-private-key:
    file: ./taskforge-auth-service/jwt-private.pem

volumes:
  taskforge_postgres_data:
  kafka_data:
